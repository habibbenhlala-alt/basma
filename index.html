let L='ar',S={user:null,profile:null,tab:'home',joinType:'student',initiatives:[],rewards:[],institutions:[],reactions:[],reports:[],balance:0,ledger:[]},PH=[],CT='env',TH=localStorage.getItem('basma_theme')||'light';

 const staff=S.joinType==='staff';
 return `<h2>${L==='ar'?'أهلاً بك في بصمة':'Bienvenue sur BASMA'}</h2>
 <div class="card">
 <p>${L==='ar'?'أكمل إعداد حسابك للمتابعة':'Complétez votre compte pour continuer'}</p>
 <label>${L==='ar'?'اسم الحساب':'Identifiant'}</label>

 <select onchange="setJoinType(this.value)">
 <option value="student" ${!staff?'selected':''}>${t('student')}</option>
 <option value="staff" ${staff?'selected':''}>${L==='ar'?'أستاذ أو مدير':'Enseignant ou directeur'}</option>

 ${staff?`<label>${t('invite')}</label><input id="newInvite" maxlength="30">`:
 `<label>${t('school')}</label><select id="newInstitution"><option value="">${L==='ar'?'اختر المؤسسة':'Choisir établissement'}</option>${S.institutions.map(x=>`<option value="${x.id}">${esc(nameInst(x))}</option>`).join('')}</select>`}
 <button style="width:100%;margin-top:12px" onclick="completeOnboarding()">${L==='ar'?'حفظ ومتابعة':'Enregistrer et continuer'}</button>

async function completeOnboarding(){
 const username=val('newUsername').trim().toLowerCase();
 if(!/^[a-z0-9_]{3,30}$/.test(username)||username.startsWith('basma_')){toast(L==='ar'?'اسم الحساب: 3 إلى 30 حرفاً إنجليزياً أو رقماً أو _، ولا يبدأ بـ basma_':'Identifiant invalide : 3 à 30 caractères, sans le préfixe basma_');return}
 if(S.joinType==='staff'){
  const code=val('newInvite').trim();if(!code){toast(t('invite'));return}
  const {error}=await db.rpc('claim_invite',{p_code:code});
  if(error){toast(t('invbad')+' — '+(error.message||''));return}
 }else{
  const institution=val('newInstitution');if(!institution){toast(t('school'));return}
  if(!S.profile.institution_id){
   const {error}=await db.rpc('set_my_institution',{p_inst:institution});
   if(error){err(error);return}
  }
 }
 const {error}=await db.rpc('set_my_username',{p_username:username});
 if(error){err(error);return}
 await refreshSession();
 toast(L==='ar'?'مرحباً بك في بصمة':'Bienvenue sur BASMA');
}

 const {data:{user},error:userError}=await db.auth.getUser();
 if(userError){err(userError);return}
 S.user=user;
 if(!user){S.profile=null;render();return}

 S.tab='home';
 if(needsOnboarding()){render();return}
 await loadData();render();
  }
  async function loadData(){let inst=S.profile.institution_id;let [ii,rr,ll,rx,reps]=await Promise.all([

let n=approved.length,e=approved.reduce((a,x)=>a+x.points,0),env=approved.filter(x=>x.category==='env').length,b=[[n>=1,'🌱','b1'],[n>=3,'⭐','b2'],[e>=100,'🏆','b3'],[env>=2,'🌳','b4']];return `<h2>${t('ach')}</h2><div class="card">${b.map(x=>`<p style="padding:8px;opacity:${x[0]?1:.35}">${x[1]} ${t(x[2])}</p>`).join('')}</div>`}
function addForm(){return `<h2>${t('add')}</h2><div class="card"><label class="cam"><span style="font-size:38px">📷</span><b>${t('snap')}</b><input id="photoCamera" type="file" accept="image/*" capture="environment" hidden onchange="pickPhotos(this)"></label><label class="mu" for="photoGallery">${t('gallery')}</label><input id="photoGallery" type="file" accept="image/*" multiple onchange="pickPhotos(this)"><div id="preview" class="pv">${PH.map(x=>`<img src="${x}">`).join('')}</div><label class="ck" id="consentWrap" style="display:${PH.length?'flex':'none'}"><input id="consent" type="checkbox"><span>${t('consent')}</span></label><label>${t('title')}</label><input id="title" maxlength="120"><div class="row chips">${['env','soc','cul','civ'].map(c=>`<button class="${CT===c?'on':''}" onclick="CT='${c}';render()">${t(c)}</button>`).join('')}</div><label>${t('desc')}</label><textarea id="description" rows="3" maxlength="2000"></textarea><p class="mu">${t('note')}</p><button style="width:100%" onclick="submitInitiative()">${t('send')}</button></div>`}
async function pickPhotos(el){let files=[...el.files].slice(0,3-PH.length);el.value='';for(const f of files){try{let data=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});let img=await new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=data});let scale=Math.min(1,640/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);PH.push(c.toDataURL('image/jpeg',.48));}catch(e){toast(t('ph_err'))}}render()}
async function submitInitiative(){let title=val('title').trim(),description=val('description').trim();if(!title&&!PH.length){toast(t('needone'));return}if(PH.length&&!$('consent')?.checked){toast(t('needck'));return}if(!title)title=t(CT);if(PH.reduce((n,s)=>n+s.length,0)>590000){toast(t('full'));return}
let payload={student_id:S.user.id,institution_id:S.profile.institution_id,title:title.slice(0,120),description,category:CT,imgs:PH};let {error}=await db.from('initiatives').insert(payload);if(error){err(error);return}PH=[];CT='env';await loadData();S.tab='mine';render();toast(t('sent'))}
async function redeem(id){let {error}=await db.rpc('redeem_reward',{p_reward:id});if(error){err(error);return}await loadData();render();toast(t('done'))}
function supervisorPage(){if(S.tab==='feed')return feedPage();let mine=S.initiatives.filter(i=>i.institution_id===S.profile.institution_id);if(S.tab==='hist'){let done=mine.filter(i=>i.status!=='pending').map(i=>initCard(i)).join('');return `<h2>${t('hist')}</h2>${done||`<p class="mu">${t('empty')}</p>`}`}let q=mine.filter(i=>i.status==='pending');let cards=q.map(i=>{let actions=`<label>${t('giv')} (1-100)</label><input id="points_${i.id}" type="number" min="1" max="100" value="20"><label>${t('rsn')}</label><input id="note_${i.id}"
maxlength="500">`;if(i.imgs?.length)actions+=`<label class="ck"><input id="publish_${i.id}" type="checkbox" checked><span>${t('pub')}</span></label>`;actions+=`<div class="row"><button onclick="review('${i.id}',true)">${t('approve')}</button><button class="d" onclick="review('${i.id}',false)">${t('reject')}</button></div>`;return initCard(i,actions)}).join('');return `<h2>${t('queue')}</h2>${cards||`<p class="mu">${t('nsup')}</p>`}`}
async function review(id,approve){let points=Number(val('points_'+id)),note=val('note_'+id).trim(),pub=!!$('publish_'+id)?.checked;if(approve&&!(points>=1&&points<=100)){toast(t('fill'));return}if(!approve&&!note){toast(t('rsn'));return}let {error}=await db.rpc('review_initiative',{p_id:id,p_approve:approve,p_points:approve?points:0,p_note:note,p_pub:approve&&pub});if(error){err(error);return}await loadData();render()}
function statsPage(sc){let ii=S.initiatives.filter(i=>sc==null||i.institution_id===sc),count=ii.length||1;let bars=['env','soc','cul','civ'].map(c=>{let n=ii.filter(i=>i.category===c).length;return `<div class="row sp"><span>${t(c)}</span><b>${n}</b></div><div class="bar"><i style="width:${Math.round(n/count*100)}%"></i></div>`}).join('');return `<div class="row"><div class="card" style="flex:1"><div class="num">${new Set(ii.map(i=>i.student_id)).size}</div>${t('sub')}</div><div class="card" style="flex:1"><div class="num">${ii.length}</div>${t('snt')}</div><div class="card" style="flex:1"><div class="num">${ii.filter(i=>i.status==='approved').length}</div>${t('apr')}</div></div>${bars}`}
function directorPage(){if(S.tab==='feed')return feedPage();return `<h2>${t('stats')}</h2>${statsPage(S.profile.institution_id)}`}
function adminPage(){if(S.tab==='feed')return feedPage();if(S.tab==='rew')return `<h2>${t('newrew')}</h2><div class="card"><label>${t('rname')} (AR)</label><input id="rewardAr" maxlength="80"><label>${t('rname')} (FR)</label><input id="rewardFr" maxlength="80"><label>${t('rcost')}</label><input id="rewardCost" type="number" min="1"><label>${t('stock')}</label><input id="rewardStock" type="number" min="0" placeholder="فارغ = غير محدود"><button style="width:100%" onclick="createReward()">${t('newrew')}</button></div>${S.rewards.map(r=>`<div class="card row sp"><span>${esc(nameReward(r))}</span><b>${r.cost}</b></div>`).join('')}`;
return `<h2>${t('stats')}</h2>${statsPage(null)}<h2>${t('reps')}</h2>${S.reports.map(r=>`<div class="card">${esc(r.message)}<p class="mu">${new Date(r.created_at).toLocaleString()}</p></div>`).join('')||`<p class="mu">${t('empty')}</p>`}`}
async function createReward(){let name_ar=val('rewardAr').trim(),name_fr=val('rewardFr').trim(),cost=Number(val('rewardCost')),stockRaw=val('rewardStock'),stock=stockRaw===''?null:Number(stockRaw);if(name_ar.length<2||name_fr.length<2||cost<1||!Number.isInteger(cost)||!(stock===null||(Number.isInteger(stock)&&stock>=0))){toast(t('fill'));return}let {error}=await db.from('rewards').insert({name_ar,name_fr,cost,stock,active:true,institution_id:null});if(error){err(error);return}await loadData();render()}
function feedPage(){let posts=S.initiatives.filter(i=>i.pub&&i.status==='approved'&&i.institution_id===S.profile.institution_id);return `<h2>${t('feed')}</h2><p class="mu">${t('rxnote')}</p>${posts.map(i=>{let rs=S.reactions.filter(x=>x.initiative_id===i.id);return `<div class="card">${images(i)}<h3>${esc(i.title)}</h3><p class="mu">${t(i.category)} • ${t('anon')}</p>${i.description?`<p>${esc(i.description)}</p>`:''}<div class="rx">${['❤️','😂','👏','🌱'].map(e=>{let count=rs.filter(x=>x.emoji===e).length,own=rs.find(x=>x.user_id===S.user.id)?.emoji===e;return `<button class="${own?'on':''}" onclick="react('${i.id}','${e}')">${e} ${count||''}</button>`}).join('')}</div>${['supervisor','principal'].includes(role())?`<p style="margin-top:8px"><button class="s" onclick="hidePost('${i.id}')">${t('hide')}</button></p>`:''}</div>`}).join('')||`<p class="mu">${t('nofeed')}</p>`}`}
async function react(id,emoji){let old=S.reactions.find(x=>x.initiative_id===id&&x.user_id===S.user.id);let result;if(old){result=await db.from('reactions').delete().eq('initiative_id',id).eq('user_id',S.user.id);if(result.error){err(result.error);return}if(old.emoji!==emoji){result=await db.from('reactions').insert({initiative_id:id,user_id:S.user.id,emoji})}}else{result=await db.from('reactions').insert({initiative_id:id,user_id:S.user.id,emoji})}if(result.error){err(result.error);return}await loadData();render()}
async function hidePost(id){let {error}=await db.rpc('unpublish_initiative',{p_id:id});if(error){err(error);return}await loadData();render()}
async function reportProblem(){let message=prompt(t('repq'));if(!message?.trim())return;let {error}=await db.from('reports').insert({user_id:S.user.id,message:message.trim().slice(0,500)});if(error){err(error);return}toast(t('repok'))}
async function init(){
 try{
  await loadInstitutions();
  const {data:{session}}=await db.auth.getSession();
  if(session)await refreshSession();else render();
 }catch(e){render();err(e)}
}
let authRefreshRunning=false;
db.auth.onAuthStateChange((_event,session)=>{
 if(session&&!authRefreshRunning){
  authRefreshRunning=true;
  setTimeout(async()=>{try{await refreshSession()}finally{authRefreshRunning=false}},0);
 }else if(!session){
  S.user=null;S.profile=null;render();
 }
});
init();
</script></body></html>
