nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0);z-index:9}
nav div{display:flex;max-width:560px;width:100%}nav button{flex:1;background:none;color:var(--mu);font-size:11px;padding:8px 2px;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:0}
nav button span{font-size:20px}nav button.on{color:var(--g)}
.bar{height:10px;background:var(--gl);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g2);border-radius:6px;transition:width .5s}
.bar.gold i{background:var(--gold)}.chips button{background:var(--c);color:var(--mu);border:1px solid var(--bd);padding:6px 12px;min-height:36px;font-size:13px}.chips button.on{background:var(--g);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.num{font-size:26px;font-weight:800;color:var(--g)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:24px;z-index:20;font-size:14px}
.splash{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#073d2e,var(--g2));color:#fff;text-align:center;padding:20px}
.splash .mark{width:96px;height:96px;border-radius:28px;background:#fff;color:var(--g);display:grid;place-items:center;font-size:52px;animation:pop .9s ease both}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.splash h1{font-size:40px;margin-top:16px;letter-spacing:1px}.splash p{opacity:.9;margin-top:6px}
.cam{display:flex;flex-direction:column;align-items:center;gap:4px;padding:26px;border:2px dashed var(--g2);border-radius:var(--r);cursor:pointer;color:var(--g);text-align:center}.badge{text-align:center;opacity:.35}.badge.on{opacity:1}.badge span{display:block;font-size:30px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
