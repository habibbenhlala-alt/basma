<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BASMA | بصمة</title>
<style>
:root{--g:#0b5d45;--g2:#14855f;--gl:#e3f3ec;--gold:#b8901c;--bg:#f4f8f6;--c:#fff;--tx:#12231c;--mu:#5d7168;--bd:#d9e4de;--rd:#b8372b}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.6 "Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:76px}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}.logo{font-weight:800;color:var(--g);font-size:18px}.logo small{color:var(--gold);margin-inline-start:6px}
.pg{padding:4px 16px 16px}h2{font-size:19px;margin:14px 0 8px}h3{font-size:15px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.hero{color:#fff;border:0;background:repeating-radial-gradient(circle at 85% 20%,#ffffff14 0 3px,transparent 3px 11px),linear-gradient(135deg,var(--g),var(--g2))}
[dir=ltr] .hero{background:repeating-radial-gradient(circle at 15% 20%,#ffffff14 0 3px,transparent 3px 11px),linear-gradient(135deg,var(--g),var(--g2))}
.hero b{font-size:42px;line-height:1.1;display:block}.hero i{color:#f3d675;font-size:18px;font-style:normal}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;background:var(--g);color:#fff;font-weight:600;min-height:44px}
button.s{background:var(--gl);color:var(--g)}button.d{background:var(--rd)}button:disabled{opacity:.45}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--tx);margin:4px 0 10px;min-height:44px}
label{font-size:13px;color:var(--mu);font-weight:600}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.tag{font-size:12px;padding:2px 10px;border-radius:20px;background:var(--gl);color:var(--g);font-weight:700}.tag.pending{background:#fdf1d3;color:#8a6500}.tag.no{background:#fbe3df;color:var(--rd)}
.gd{color:var(--gold);font-weight:800}.mu{color:var(--mu);font-size:13px}.num{font-size:26px;font-weight:800;color:var(--g)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);z-index:9;padding-bottom:env(safe-area-inset-bottom,0)}
nav div{display:flex;max-width:560px;margin:auto}nav button{flex:1;background:none;color:var(--mu);font-size:11px;padding:8px 2px;border-radius:0;display:flex;flex-direction:column;align-items:center}nav button span{font-size:20px}nav button.on{color:var(--g)}
.bar{height:10px;background:var(--gl);border-radius:6px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--g2)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 18px;border-radius:24px;z-index:20}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.bd{text-align:center;opacity:.35}.bd.on{opacity:1}.bd span{display:block;font-size:34px}
.lg{text-align:center;padding:26px 10px}.lg .mark{font-size:54px}.lg h1{color:var(--g);font-size:34px}
</style></head><body><div id="app"></div><div id="tt"></div>
<script>
const K={slogan:["كل مبادرة تصنع أثراً","Chaque initiative laisse une empreinte"],login:["دخول","Connexion"],reg:["إنشاء حساب","Créer un compte"],user:["المعرّف","Identifiant"],pw:["كلمة المرور","Mot de passe"],
bad:["بيانات غير صحيحة","Identifiants incorrects"],demo:["حسابات تجريبية (كلمة المرور 1234)","Comptes démo (mot de passe 1234)"],student:["تلميذ","Élève"],sup:["مشرف","Encadrant"],dir:["مدير المؤسسة","Directeur"],adm:["مدير النظام","Admin"],
name:["الاسم الكامل","Nom complet"],school:["المؤسسة","Établissement"],fill:["أكمل الحقول (كلمة المرور 4 أحرف على الأقل)","Remplissez les champs (mot de passe 4 car. min.)"],hi:["مرحباً","Bonjour"],
bal:["رصيد بصمة","Solde BASMA"],pts:["نقطة","pts"],add:["أضف مبادرة","Ajouter une initiative"],mine:["مبادراتي","Mes initiatives"],rew:["المكافآت","Récompenses"],ach:["الإنجازات","Succès"],
home:["الرئيسية","Accueil"],queue:["الطلبات","Demandes"],hist:["السجل","Historique"],stats:["الإحصائيات","Statistiques"],title:["عنوان المبادرة","Titre"],cat:["التصنيف","Catégorie"],desc:["وصف النشاط","Description"],
date:["تاريخ الإنجاز","Date"],send:["إرسال للمراجعة","Envoyer pour validation"],sent:["تم الإرسال للمراجعة","Envoyé pour validation"],dup:["مبادرة مسجلة من قبل","Initiative déjà enregistrée"],
note:["النقاط يحددها المشرف بعد المصادقة فقط.","Les points sont fixés par l'encadrant après validation."],env:["بيئية","Environnement"],soc:["اجتماعية","Social"],cul:["تربوية وثقافية","Éducatif & culturel"],civ:["مواطنة","Citoyenneté"],
pending:["قيد المراجعة","En attente"],ok:["مقبولة","Validée"],no:["مرفوضة","Refusée"],reason:["السبب","Motif"],cost:["الكلفة","Coût"],redeem:["استبدال","Échanger"],lack:["رصيدك لا يكفي","Solde insuffisant"],
done:["تم الاستبدال","Échange effectué"],approve:["اعتماد","Valider"],reject:["رفض","Refuser"],giv:["النقاط","Points"],rsn:["سبب الرفض (إجباري)","Motif du refus (obligatoire)"],empty:["لا شيء حالياً","Rien pour l'instant"],
logout:["خروج","Quitter"],report:["إبلاغ عن مشكل","Signaler un problème"],repq:["صف المشكل:","Décrivez le problème :"],repok:["وصل البلاغ","Signalement transmis"],reps:["البلاغات","Signalements"],
proto:["نموذج تجريبي: البيانات تُحفظ في هذا الجهاز فقط، وليست آمنة للاستعمال الحقيقي بعد.","Prototype : données stockées sur cet appareil uniquement, non sécurisées pour un usage réel."],
newrew:["إضافة مكافأة","Ajouter une récompense"],rname:["اسم المكافأة","Nom"],rcost:["الكلفة بالنقاط","Coût en points"],sub:["المشاركون","Participants"],snt:["المبادرات المرسلة","Envoyées"],apr:["المعتمدة","Validées"],
b1:["أول بصمة","Première empreinte"],b2:["3 مبادرات","3 initiatives"],b3:["100 نقطة","100 points"],b4:["حارس البيئة","Gardien de l'environnement"],hold:["لا توجد مبادرات بعد، أضف أول بصمة لك.","Aucune initiative : ajoutez votre première empreinte."],
all:["الكل","Tous"],nsup:["لا طلبات تنتظر المراجعة.","Aucune demande en attente."]};
let L='ar',S={u:null,tab:'home',reg:0};const KEY='basma_v1';
const seed=()=>({schools:[{id:1,n:["المعهد الثانوي بزغوان","Lycée de Zaghouan"]},{id:2,n:["المعهد الثانوي بالفحص","Lycée d'El Fahs"]}],
users:[{id:1,u:'eleve',name:'Yasmine Ben Salah',role:'student',sch:1,pw:'1234'},{id:2,u:'encadrant',name:'Mme Hela Mansouri',role:'sup',sch:1,pw:'1234'},{id:3,u:'directeur',name:'M. Karim Gharbi',role:'dir',sch:1,pw:'1234'},{id:4,u:'admin',name:'Admin BASMA',role:'adm',sch:0,pw:'1234'}],
inits:[],reds:[],reps:[],nid:10,rewards:[{id:1,n:["شهادة تقدير","Certificat de mérite"],cost:50,st:99},{id:2,n:["حقيبة أدوات مدرسية","Pack fournitures"],cost:80,st:6},{id:3,n:["رحلة تربوية","Sortie éducative"],cost:150,st:20}]});
let D=null;try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!D||!D.users)D=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const $=id=>document.getElementById(id),t=k=>{const v=K[k];return v?v[L=='ar'?0:1]:k},nm=o=>o.n[L=='ar'?0:1];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usr=id=>D.users.find(u=>u.id==id),val=id=>($(id)||{}).value||'';
const earned=id=>D.inits.filter(i=>i.sid==id&&i.st=='ok').reduce((a,i)=>a+i.pts,0);
const bal=id=>earned(id)-D.reds.filter(r=>r.sid==id).reduce((a,r)=>a+r.cost,0);
function toast(m){$('tt').innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';setTimeout(()=>$('tt').innerHTML='',2400)}
function setL(l){L=l;document.documentElement.lang=l;document.documentElement.dir=l=='ar'?'rtl':'ltr';R()}
function go(x){S.tab=x;R()}
const NAV={student:[['home','🏠'],['add','➕','add'],['mine','📋'],['rew','🎁'],['ach','🏅']],sup:[['home','📥','queue'],['hist','🗂️']],dir:[['home','📊','stats']],adm:[['home','📊','stats'],['rew','🎁']]};
const nav=()=>'<nav><div>'+NAV[S.u.role].map(n=>`<button class="${S.tab==n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${t(n[2]||n[0])}</button>`).join('')+'</div></nav>';
const topBar=()=>`<div class="top"><div class="logo">BASMA<small>بصمة</small></div><div class="row"><button class="s" style="min-height:36px;padding:4px 12px" onclick="setL('${L=='ar'?'fr':'ar'}')">${L=='ar'?'FR':'عربي'}</button>${S.u?`<button class="s" style="min-height:36px;padding:4px 12px" onclick="S.u=null;S.tab='home';R()">${t('logout')}</button>`:''}</div></div>`;
function R(){const a=$('app');if(!S.u){a.innerHTML=topBar()+login();return}
const v={student:stu,sup:sup,dir:dir,adm:adm}[S.u.role];a.innerHTML=topBar()+'<div class="pg">'+v()+`<p style="margin-top:18px"><button class="s" onclick="rep()">⚑ ${t('report')}</button></p></div>`+nav()}
function login(){return`<div class="lg"><div class="mark">👣</div><h1>بصمة | BASMA</h1><p class="gd">${t('slogan')}</p></div><div class="pg"><div class="card">${S.reg?
`<label>${t('name')}</label><input id="rn" maxlength="60"><label>${t('school')}</label><select id="rs">${D.schools.map(s=>`<option value="${s.id}">${esc(nm(s))}</option>`).join('')}</select><label>${t('user')}</label><input id="ru" maxlength="30"><label>${t('pw')}</label><input id="rp" type="password"><button onclick="doReg()">${t('reg')}</button>`:
`<label>${t('user')}</label><input id="lu" autocomplete="username"><label>${t('pw')}</label><input id="lp" type="password"><button onclick="doLogin()">${t('login')}</button>`}
<p style="margin-top:10px"><button class="s" onclick="S.reg=!S.reg;R()">${t(S.reg?'login':'reg')}</button></p></div>
<div class="card"><p class="mu">${t('demo')}</p><div class="row" style="margin-top:8px">${[['eleve','student'],['encadrant','sup'],['directeur','dir'],['admin','adm']].map(x=>`<button class="s" onclick="demo('${x[0]}')">${t(x[1])}</button>`).join('')}</div></div><p class="mu">${t('proto')}</p></div>`}
function demo(u){S.u=D.users.find(x=>x.u==u);S.tab='home';R()}
function doLogin(){const u=D.users.find(x=>x.u==val('lu').trim());if(!u||u.pw!=val('lp')){toast(t('bad'));return}S.u=u;S.tab='home';R()}
function doReg(){const u=val('ru').trim(),n=val('rn').trim();if(n.length<2||u.length<3||val('rp').length<4||D.users.some(x=>x.u==u)){toast(t('fill'));return}
D.users.push({id:D.nid++,u,name:n,role:'student',sch:+val('rs'),pw:val('rp')});save();S.reg=0;R();toast('✓')}
function rep(){const m=prompt(t('repq'));if(m&&m.trim()){D.reps.push({by:S.u.u,m:m.trim().slice(0,500)});save();toast(t('repok'))}}
const tag=s=>`<span class="tag ${s}">${t(s)}</span>`;
const card=(i,x)=>`<div class="card"><div class="row sp"><h3>${esc(i.title)}</h3>${tag(i.st)}</div><p class="mu">${t(i.cat)} • ${esc(i.date)}</p>${i.desc?`<p>${esc(i.desc)}</p>`:''}${i.st=='ok'?`<p class="gd">+${i.pts} ${t('pts')}</p>`:''}${i.reason?`<p style="color:var(--rd)">${t('reason')}: ${esc(i.reason)}</p>`:''}${x||''}</div>`;
function stu(){const u=S.u,mi=D.inits.filter(i=>i.sid==u.id),ok=mi.filter(i=>i.st=='ok');
if(S.tab=='home')return`<h2>${t('hi')} ${esc(u.name.split(' ')[0])}</h2><div class="card hero"><span>${t('bal')}</span><b>${bal(u.id)} <i>${t('pts')}</i></b><p>${ok.length} ${t('ok')}</p></div><button style="width:100%" onclick="go('add')">➕ ${t('add')}</button>`+(mi.slice(-3).reverse().map(i=>card(i)).join('')||`<p class="mu" style="margin-top:12px">${t('hold')}</p>`);
if(S.tab=='add')return`<h2>${t('add')}</h2><div class="card"><label>${t('title')}</label><input id="at" maxlength="120"><label>${t('cat')}</label><select id="ac">${['env','soc','cul','civ'].map(c=>`<option value="${c}">${t(c)}</option>`).join('')}</select><label>${t('desc')}</label><textarea id="ad" rows="3" maxlength="1000"></textarea><label>${t('date')}</label><input id="ada" type="date" value="${new Date().toISOString().slice(0,10)}"><p class="mu">${t('note')}</p><button onclick="addI()">${t('send')}</button></div>`;
if(S.tab=='mine')return`<h2>${t('mine')}</h2>`+(mi.slice().reverse().map(i=>card(i)).join('')||`<p class="mu">${t('hold')}</p>`);
if(S.tab=='rew')return`<h2>${t('rew')}</h2><div class="card hero"><b>${bal(u.id)} <i>${t('pts')}</i></b></div>`+D.rewards.map(r=>`<div class="card row sp"><div><h3>${esc(nm(r))}</h3><span class="mu">${t('cost')}: ${r.cost}</span></div><button ${bal(u.id)<r.cost||r.st<1?'disabled':''} onclick="redeem(${r.id})">${t('redeem')}</button></div>`).join('');
const n=ok.length,e=earned(u.id),en=ok.filter(i=>i.cat=='env').length,b=[[n>=1,'🌱','b1'],[n>=3,'⭐','b2'],[e>=100,'🏆','b3'],[en>=2,'🌳','b4']];
return`<h2>${t('ach')}</h2><div class="badges">${b.map(x=>`<div class="card bd ${x[0]?'on':''}"><span>${x[1]}</span>${t(x[2])}</div>`).join('')}</div>`}
function addI(){const ti=val('at').trim();if(ti.length<3){toast(t('fill'));return}
if(D.inits.some(i=>i.sid==S.u.id&&i.title==ti&&i.date==val('ada'))){toast(t('dup'));return}
D.inits.push({id:D.nid++,sid:S.u.id,title:ti,cat:val('ac'),desc:val('ad').trim(),date:val('ada'),st:'pending',pts:0});save();S.tab='mine';R();toast(t('sent'))}
function redeem(id){const r=D.rewards.find(x=>x.id==id);if(!r||r.st<1||bal(S.u.id)<r.cost){toast(t('lack'));return}
r.st--;D.reds.push({sid:S.u.id,rid:id,cost:r.cost});save();R();toast(t('done'))}
function sup(){const mine=D.inits.filter(i=>usr(i.sid)&&usr(i.sid).sch==S.u.sch);
if(S.tab=='hist')return`<h2>${t('hist')}</h2>`+(mine.filter(i=>i.st!='pending').map(i=>card(i)).join('')||`<p class="mu">${t('empty')}</p>`);
const q=mine.filter(i=>i.st=='pending');return`<h2>${t('queue')}</h2>`+(q.map(i=>card(i,`<label>${t('giv')} (1-100)</label><input id="p${i.id}" type="number" min="1" max="100" value="20"><label>${t('rsn')}</label><input id="r${i.id}" maxlength="300"><div class="row"><button onclick="rev(${i.id},1)">${t('approve')}</button><button class="d" onclick="rev(${i.id},0)">${t('reject')}</button></div>`)).join('')||`<p class="mu">${t('nsup')}</p>`)}
function rev(id,ok){const i=D.inits.find(x=>x.id==id);if(!i||i.st!='pending'||usr(i.sid).sch!=S.u.sch||S.u.role!='sup')return;
if(ok){const p=Math.round(+val('p'+id));if(!(p>=1&&p<=100)){toast(t('fill'));return}i.st='ok';i.pts=p}
else{const r=val('r'+id).trim();if(!r){toast(t('rsn'));return}i.st='no';i.reason=r}i.by=S.u.u;save();R()}
const stats=sc=>{const ii=D.inits.filter(i=>sc==null||usr(i.sid)&&usr(i.sid).sch==sc),n=ii.length||1;
return`<div class="row"><div class="card" style="flex:1"><div class="num">${new Set(ii.map(i=>i.sid)).size}</div>${t('sub')}</div><div class="card" style="flex:1"><div class="num">${ii.length}</div>${t('snt')}</div><div class="card" style="flex:1"><div class="num">${ii.filter(i=>i.st=='ok').length}</div>${t('apr')}</div></div>`+['env','soc','cul','civ'].map(c=>{const k=ii.filter(i=>i.cat==c).length;return`<div class="row sp"><span>${t(c)}</span><b>${k}</b></div><div class="bar"><i style="width:${Math.round(k/n*100)}%"></i></div>`}).join('')};
const dir=()=>`<h2>${t('stats')}</h2>`+stats(S.u.sch);
function adm(){if(S.tab=='rew')return`<h2>${t('newrew')}</h2><div class="card"><label>${t('rname')}</label><input id="nn" maxlength="60"><label>${t('rcost')}</label><input id="nc" type="number" min="1" max="1000"><button onclick="addR()">${t('newrew')}</button></div>`+D.rewards.map(r=>`<div class="card row sp"><span>${esc(nm(r))}</span><b>${r.cost}</b></div>`).join('');
return`<h2>${t('stats')}</h2>`+stats(null)+`<h2>${t('reps')}</h2>`+(D.reps.map(r=>`<div class="card"><p>${esc(r.m)}</p><p class="mu">${esc(r.by)}</p></div>`).join('')||`<p class="mu">${t('empty')}</p>`)}
function addR(){const n=val('nn').trim(),c=Math.round(+val('nc'));if(!n||!(c>=1)||S.u.role!='adm'){toast(t('fill'));return}D.rewards.push({id:D.nid++,n:[n,n],cost:c,st:50});save();R()}
R();
</script></body></html>
